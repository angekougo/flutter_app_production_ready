name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Un nouveau push annule l'exécution en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  quality:
    name: Lint, analyse et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # `.env` est déclaré comme asset : il doit exister (vide suffit, les
      # tests n'appellent aucune API réelle).
      - name: Préparer l'environnement
        run: touch .env

      - name: Dépendances
        run: flutter pub get

      - name: Traductions générées à jour
        run: |
          flutter gen-l10n
          git diff --exit-code lib/l10n

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver tool

      # Fichiers et lignes cités dans le README : toujours conformes au code.
      - name: Références du README à jour
        run: tool/ci/run.sh "README" dart run tool/readme_refs.dart --check

      - name: Analyse statique
        run: tool/ci/run.sh "Analyse statique" flutter analyze --fatal-infos --fatal-warnings

      - name: Tests unitaires et de widgets
        run: tool/ci/run.sh "Tests" flutter test --coverage --reporter expanded

      - name: Couverture
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lcov
          lcov --quiet --ignore-errors unused --remove coverage/lcov.info \
            '**/*.g.dart' '**/l10n/app_localizations*.dart' \
            -o coverage/lcov.info
          {
            echo '### Couverture de code'
            echo '```'
            lcov --summary coverage/lcov.info 2>&1 | grep -E 'lines|functions'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  integration:
    name: Tests d'intégration (Linux)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dépendances système (bureau Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libjsoncpp-dev xvfb

      - name: Préparer l'environnement
        run: |
          touch .env
          flutter config --enable-linux-desktop
          flutter pub get

      - name: Parcours utilisateur
        run: >-
          tool/ci/run.sh "Parcours utilisateur"
          xvfb-run -a flutter test integration_test/app_journeys_test.dart
          -d linux --reporter expanded

      # Mode profile : seules mesures représentatives (AOT, sans assertions).
      # Lancée même si les parcours échouent : les deux diagnostics sont utiles.
      - name: Performance du défilement (60 fps)
        if: success() || failure()
        run: |
          tool/ci/run.sh "Performance" xvfb-run -a flutter drive --profile \
            --driver=test_driver/perf_driver.dart \
            --target=integration_test/scroll_performance_test.dart \
            -d linux
          {
            echo '### Performance du défilement (mode profile)'
            echo '```json'
            jq '{frame_count, average_frame_build_time_millis,
                 "90th_percentile_frame_build_time_millis",
                 "99th_percentile_frame_build_time_millis",
                 worst_frame_build_time_millis,
                 missed_frame_build_budget_count}' build/scrolling_summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Résumé aussi publié en annotation (visible sur la page du run).
          echo "::notice title=Performance du défilement::$(jq -c '{
            images: .frame_count,
            construction_moyenne_ms: .average_frame_build_time_millis,
            construction_p90_ms: ."90th_percentile_frame_build_time_millis",
            construction_p99_ms: ."99th_percentile_frame_build_time_millis",
            hors_budget: .missed_frame_build_budget_count}' build/scrolling_summary.json)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance
          path: build/scrolling_summary.json
          if-no-files-found: ignore

  android:
    name: APK Android
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # publication de la release sur un tag
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Clés côté client (jeton TMDB en lecture, clé publiable Supabase) :
      # injectées depuis les secrets du dépôt, jamais commitées.
      - name: Configuration de l'application
        env:
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'TMDB_READ_TOKEN=%s\nSUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' \
            "$TMDB_READ_TOKEN" "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > .env
          if [ -z "$TMDB_READ_TOKEN" ]; then
            echo "::warning::Secrets absents : l'APK sera construit mais ne pourra pas joindre TMDB ni Supabase."
          fi

      # Signature de release si le keystore est fourni, sinon clé de debug.
      - name: Keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          else
            echo "::notice::Pas de keystore : APK signé avec la clé de debug (démonstration)."
          fi

      - name: Build APK release
        run: |
          flutter pub get
          tool/ci/run.sh "Build APK" flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk cinetheque-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: cinetheque-*.apk

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: cinetheque-*.apk
          generate_release_notes: true
