name: flutter_app_production_ready
description: "Cinéthèque — découverte cinématographique (TMDB, Supabase Auth, Isar)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cached_network_image: ^4.0.2
  connectivity_plus: ^7.3.1
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  hooks_riverpod: ^3.4.3
  intl: ^0.20.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.15.1
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
